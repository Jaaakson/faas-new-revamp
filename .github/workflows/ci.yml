name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Callable from release.yml, so a release runs the *same* checks a pull
  # request does rather than a second, drifting copy of them.
  workflow_call:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fvas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # FACE_ENGINE=fake keeps the run at ~2 minutes instead of ~10 by skipping
      # the ~350 MB model download. This is the payoff of the FaceEngine
      # protocol (docs/05-architecture.md §7).
      FACE_ENGINE: fake
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fvas_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-real-0000000000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Migrations apply and roll back
        # Reversibility is a stated requirement, so it is verified rather than
        # assumed — an irreversible migration is found here, not during an
        # incident.
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Schema matches the models
        # `alembic check` autogenerates against the migrated database and fails
        # if it finds anything to do. Without it, a column added to a model
        # without a migration passes every test on a create_all-built test
        # database and only fails in production.
        run: uv run alembic check

      - name: Tests (SQLite)
        # Fast path: no services, runs in seconds, covers every push.
        # `--cov-fail-under` is the gate. The threshold sits a few points
        # below the current figure so an ordinary refactor does not trip it,
        # while a genuine drop in tested behaviour does.
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Tests (PostgreSQL)
        # Fidelity path: the same suite against the real engine, which catches
        # what SQLite cannot model — JSONB, citext, native partial indexes, and
        # server-side default behaviour.
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fvas_test
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE fvas_test;'
          uv run pytest -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  # ── Frontend ───────────────────────────────────────────────────────────────
  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # ── Contract ───────────────────────────────────────────────────────────────
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    needs: [api]
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen

      - name: Export the schema
        run: uv run python -m app.cli export-openapi > ../../openapi.json

      - name: Fail if the committed schema drifted
        # This is what makes "the backend schema is the source of truth"
        # enforceable rather than aspirational: a public response model cannot
        # change without the change being visible in review.
        working-directory: .
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::openapi.json is out of date. Run: make openapi"
            exit 1
          fi

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans history, not just the diff

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies
        working-directory: apps/api
        run: uvx pip-audit --strict --desc

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  # ── Commits ────────────────────────────────────────────────────────────────
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint commit messages in this PR
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
